[package]
name = "client"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
# Build-time capability for integration tests that need trust-state construction
# without external key material. Not a production feature toggle.
test-support = []

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
game_edition = { path = "../game_edition" }
protocol = { path = "../protocol" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
resource_manifest = { path = "../resource_manifest" }
server_browser = { path = "../server_browser" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio.workspace = true
toml.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true

[dev-dependencies]
server = { path = "../server" }
tempfile = "3"

[[test]]
name = "repair_execution"
required-features = ["test-support"]

[[test]]
name = "replay_determinism"
